[build.environment]
  # NEXT_PUBLIC_* values are intentionally inlined into the client bundle by
  # Next.js and are designed to be public (Supabase URL/anon key, VAPID public key).
  # Exclude only these keys from secrets scanning; all other secrets remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_VAPID_PUBLIC_KEY"
